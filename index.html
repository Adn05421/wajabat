<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8741a"><title>موسوعة الوجبات</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--tx:#2b2118;--mut:#7a6a5a;--or:#e8741a;--gr:#3f8f4f;--bd:#eadfce}
[data-theme=dark]{--bg:#1a1612;--card:#262019;--tx:#f3e9dc;--mut:#b3a595;--bd:#3a3128}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Tajawal","Noto Naskh Arabic",Tahoma,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--or);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
header button{background:none;border:0;color:#fff;font-size:24px;padding:0 6px}
main{padding:14px;max-width:640px;margin:auto}
h2{font-size:19px;margin:18px 0 8px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--or);color:#fff;font-weight:700;font-size:18px;padding:10px 16px;margin:8px 0}
.btn.g{background:var(--gr)}.btn.o{background:var(--card);color:var(--tx);border:2px solid var(--bd)}.btn.r{background:#c0392b}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
input,select,textarea{width:100%;min-height:50px;border:2px solid var(--bd);border-radius:12px;background:var(--card);padding:8px 12px;margin:4px 0}
.hero{position:relative;border-radius:20px;overflow:hidden;height:210px;margin-bottom:12px}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.hero div{position:absolute;inset:auto 0 0 0;padding:30px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-weight:700;font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:16px 8px;text-align:center;font-weight:700;min-height:100px}
.cat span{display:block;font-size:34px}.cat:nth-child(odd){border-color:var(--or)}.cat:nth-child(even){border-color:var(--gr)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin:8px 0}
.item .th{width:64px;height:64px;border-radius:12px;background:var(--bd);object-fit:cover;display:grid;place-items:center;font-size:28px;flex:none}
.item b{display:block}.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;background:var(--bd);border-radius:20px;padding:0 10px;font-size:13px;margin-inline-end:4px}.tag.m{background:var(--gr);color:#fff}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 0;font-size:14px;color:var(--mut)}nav button span{display:block;font-size:24px}nav .on{color:var(--or);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-width:640px;margin:auto;border-radius:22px 22px 0 0;padding:16px;max-height:90vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chip{background:var(--or);color:#fff;border-radius:20px;padding:2px 12px;font-size:14px}
.chips.q button{border:2px solid var(--bd);background:var(--card);border-radius:20px;padding:4px 12px}.chips.q .on{background:var(--gr);color:#fff;border-color:var(--gr)}
.ing{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd)}.ing b{color:var(--or)}
ol{padding-inline-start:22px}ol li{margin:8px 0}
.step{display:flex;gap:6px;align-items:flex-start}.step textarea{min-height:60px}.step button,.rowb button{border:0;background:var(--bd);border-radius:10px;min-width:40px;min-height:40px}
.rowb{display:grid;grid-template-columns:70px 110px 1fr 40px;gap:4px}
.stp{display:flex;align-items:center;justify-content:center;gap:18px;font-size:22px;margin:6px 0}.stp button{width:46px;height:46px;border-radius:50%;border:0;background:var(--or);color:#fff;font-size:26px}
.img{width:100%;height:220px;object-fit:cover;border-radius:16px;background:var(--bd)}
.toast{position:fixed;bottom:96px;inset-inline:16px;background:#222;color:#fff;border-radius:12px;padding:12px;text-align:center;z-index:20}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;z-index:30;font-size:20px;text-align:center}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gr)}
</style></head><body>
<header><button id="bk" onclick="back()" hidden aria-label="رجوع">➜</button><span id="ttl">موسوعة الوجبات</span></header>
<main id="app"></main><div id="sh"></div>
